allowed_domains: |
  youtube.com
  *.youtube.com
  youtu.be
  vimeo.com
  *.vimeo.com
  player.vimeo.com
  dailymotion.com
  *.dailymotion.com
  spotify.com
  *.spotify.com
  soundcloud.com
  *.soundcloud.com
  google.com
  *.google.com
  maps.google.com
  docs.google.com
  drive.google.com
  calendly.com
  *.calendly.com
  typeform.com
  *.typeform.com
  loom.com
  *.loom.com
  figma.com
  *.figma.com
  codepen.io
  codesandbox.io
  jsfiddle.net
  slides.com
  slideshare.net
  prezi.com
  canva.com
  *.canva.com
  miro.com
  *.miro.com
  airtable.com
  *.airtable.com
default_width: '100%'
default_height: '400'
default_aspect_ratio: '16:9'
responsive_default: true
lazy_loading_default: true
enable_sandbox: true
sandbox_attributes:
  - 'allow-scripts'
  - 'allow-same-origin'
  - 'allow-popups'
  - 'allow-presentation'
allow_attributes:
  - 'accelerometer'
  - 'autoplay'
  - 'clipboard-write'
  - 'encrypted-media'
  - 'fullscreen'
  - 'gyroscope'
  - 'picture-in-picture'
  - 'web-share'
