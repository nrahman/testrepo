# CKEditor 5 plugin library.
ckeditor5.secureEmbed:
  js:
    js/ckeditor5_plugins/secureEmbed/build/secureEmbed.js: { minified: true }
  dependencies:
    - core/ckeditor5

# Admin styles for settings form.
admin:
  css:
    theme:
      css/secure-embed.admin.css: {}

# Dialog form library.
secure_embed.dialog:
  css:
    component:
      css/secure-embed.dialog.css: {}
  js:
    js/secure-embed.dialog.js: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - core/jquery

# Frontend rendering library.
secure_embed.frontend:
  css:
    component:
      css/secure-embed.css: {}
  js:
    js/secure-embed.js: {}
  dependencies:
    - core/drupal
    - core/once
